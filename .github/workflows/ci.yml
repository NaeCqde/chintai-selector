name: ci

on:
    push:
        branches: ["**"]
        tags:
            - "v*"
        paths-ignore:
            - "**.md"
            - "LICENSE*"
            - "docs/**"
            - ".gitignore"
            - ".gitattributes"
            - ".prettierrc*"
            - ".editorconfig"
            - ".vscode/**"
            - ".github/dependabot.yml"
            - ".github/workflows/security.yml"
            - "**/.DS_Store"
    pull_request:
        paths-ignore:
            - "**.md"
            - "LICENSE*"
            - "docs/**"
            - ".gitignore"
            - ".gitattributes"
            - ".prettierrc*"
            - ".editorconfig"
            - ".vscode/**"
            - ".github/dependabot.yml"
            - ".github/workflows/security.yml"
            - "**/.DS_Store"
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag of the release to create (made from the selected branch if it does not exist)"
                required: true

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    RUST_BACKTRACE: 1
    CARGO_TERM_COLOR: always

jobs:
    # A push to main is, as a rule, the merge of a pull request that has already been built. When the tree of the merged commit is
    # the very tree that the pull request run built (every platform recorded it in TREE-<platform>), that run's files are used and
    # nothing is built again; any other case (main moved on, a direct push, a build missing or expired) builds as usual.
    reuse:
        name: Reuse the pull request build
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            actions: read
            pull-requests: read
        outputs:
            reuse: ${{ steps.find.outputs.reuse }}
        steps:
            - uses: actions/checkout@v4
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              with:
                  persist-credentials: false
            - name: Find the build of the pull request
              id: find
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].head.sha // empty')
                  [ -n "$head" ] || { echo "no pull request: build"; exit 0; }
                  run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event pull_request --commit "$head" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
                  [ -n "$run" ] || { echo "no successful run of the pull request: build"; exit 0; }
                  # only a run of a branch of this repository: the files of a fork's run are built by code that nobody here has trusted
                  [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.head_repository.full_name')" = "$GITHUB_REPOSITORY" ] || { echo "the pull request run is from a fork: build"; exit 0; }
                  mkdir dl reuse
                  gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'chintai-selector-*' --pattern 'web-dist' --dir dl || { echo "download failed: build"; exit 0; }
                  mine=$(git rev-parse 'HEAD^{tree}')
                  n=0
                  for f in dl/*/TREE-*; do
                    [ -f "$f" ] && [ "$(cat "$f")" = "$mine" ] || { echo "the tree differs from the pull request build: build"; exit 0; }
                    n=$((n + 1))
                  done
                  # one per platform of the matrix below
                  [ "$n" -eq 4 ] || { echo "$n platforms only: build"; exit 0; }
                  mv dl/chintai-selector-*/* reuse/
                  echo "reuse run $run (tree $mine)"
                  echo "reuse=true" >> "$GITHUB_OUTPUT"
            - uses: actions/upload-artifact@v4
              if: steps.find.outputs.reuse == 'true'
              with:
                  name: chintai-selector-reused
                  path: reuse/*
                  if-no-files-found: error
                  retention-days: 1
            - uses: actions/upload-artifact@v4
              if: steps.find.outputs.reuse == 'true'
              with:
                  name: web-dist
                  path: dl/web-dist
                  if-no-files-found: error
                  retention-days: 1

    check:
        needs: [reuse]
        if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' }}
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  override: true
                  profile: minimal
                  components: rustfmt, clippy
                  target: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@v2
            - name: fmt
              run: cargo fmt --all --check
            - name: clippy (native crates)
              run: cargo clippy --workspace --exclude chintai-web --all-targets -- -D warnings
            - name: clippy (wasm)
              run: cargo clippy -p chintai-web --target wasm32-unknown-unknown -- -D warnings
            - name: test
              run: cargo test --workspace --exclude chintai-web
            - name: wasm build
              run: cargo build -p chintai-web --target wasm32-unknown-unknown

    # The web part (WASM) is built once; every platform's archive gets the same web/dist.
    web:
        name: Build - web
        needs: [reuse, check]
        if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' && needs.check.result == 'success' }}
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  override: true
                  profile: minimal
                  target: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@v2
            - name: Install wasm-bindgen-cli (the version of Cargo.lock)
              run: |
                  v=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[^0-9.]/,"",$0); print; exit}' Cargo.lock)
                  cargo install wasm-bindgen-cli --locked --version "$v"
            - run: bash web/build.sh --release
            - uses: actions/upload-artifact@v4
              with:
                  name: web-dist
                  path: web/dist
                  if-no-files-found: error
                  retention-days: 1

    package:
        name: Build - ${{ matrix.platform.os-name }}
        needs: [reuse, web]
        if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' && needs.web.result == 'success' }}
        strategy:
            fail-fast: false
            matrix:
                platform:
                    - {os-name: macOS-aarch64, runs-on: macos-latest, target: aarch64-apple-darwin, ext: "", zip: false}
                    - {os-name: Windows-x86_64, runs-on: windows-2025, target: x86_64-pc-windows-msvc, ext: ".exe", zip: true}
                    - {os-name: Linux-x86_64-musl, runs-on: ubuntu-24.04, target: x86_64-unknown-linux-musl, ext: "", zip: false}
                    - {os-name: Linux-aarch64-musl, runs-on: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, ext: "", zip: false}
        runs-on: ${{ matrix.platform.runs-on }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  override: true
                  profile: minimal
                  target: ${{ matrix.platform.target }}
            - uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.platform.target }}
            # musl-gcc compiles the C parts (SQLite) for the musl targets
            - name: Install musl tools
              if: contains(matrix.platform.target, 'linux-musl')
              run: sudo apt-get update && sudo apt-get install -y musl-tools
            - name: Build
              shell: bash
              run: |
                  if [ "${{ matrix.platform.target }}" = "x86_64-unknown-linux-musl" ]; then export CC_x86_64_unknown_linux_musl=musl-gcc; fi
                  if [ "${{ matrix.platform.target }}" = "aarch64-unknown-linux-musl" ]; then export CC_aarch64_unknown_linux_musl=musl-gcc; fi
                  cargo build --locked --release --target ${{ matrix.platform.target }} -p chintai-server -p chintai-scraper
            - uses: actions/download-artifact@v4
              with:
                  name: web-dist
                  path: web-dist
            # One file per program and platform, uploaded as it is (no archive): <program>-<platform>[.exe], and its SHA-256 next to it.
            # The license, the changes and the config templates are added once, by the release job.
            - name: Package
              shell: bash
              run: |
                  mkdir out
                  git rev-parse 'HEAD^{tree}' > "out/TREE-${{ matrix.platform.os-name }}"
                  for b in chintai-server ingest; do
                    asset="chintai-selector-$b-${{ matrix.platform.os-name }}${{ matrix.platform.ext }}"
                    cp "target/${{ matrix.platform.target }}/release/$b${{ matrix.platform.ext }}" "out/$asset"
                    (cd out && { sha256sum "$asset" 2>/dev/null || shasum -a 256 "$asset"; } > "$asset.sha256")
                  done
            - uses: actions/upload-artifact@v4
              with:
                  name: chintai-selector-${{ matrix.platform.os-name }}
                  path: out/*
                  if-no-files-found: error
                  retention-days: 1

    release:
        name: Release
        needs: [reuse, package]
        if: ${{ !cancelled() && (needs.reuse.outputs.reuse == 'true' || needs.package.result == 'success') }}
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  path: dist
                  pattern: chintai-selector-*
                  merge-multiple: true
            - name: Move the latest tag
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/latest" -f sha="${{ github.sha }}" -F force=true \
                    || gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/latest" -f sha="${{ github.sha }}"
            # The rolling release is made again by every push (the tag was moved just above): its date is the date of the push, and only the
            # files of this run are in it.
            - name: Remove the old rolling release
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release delete latest --repo "${{ github.repository }}" --yes || true
            # Next to the executables, once: the license and the files this repository has of Changes.md and config templates (a file name that starts with a dot cannot be a
            # release asset, so .env is example.env).
            - name: Add the files that are the same on every platform
              run: |
                  rm -f dist/TREE-*
                  cp "LICENSE" "dist/LICENSE"
                  cp "Changes.md" "dist/Changes.md"
            # The web part is the same on every platform: one zip.
            - uses: actions/download-artifact@v4
              with:
                  name: web-dist
                  path: web-dist
            - name: Zip the web part
              run: (cd web-dist && zip -qr ../dist/chintai-selector-web.zip .)
            - name: Make the release
              if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'latest' }}
                  target_commitish: ${{ github.sha }}
                  prerelease: false
                  # the rolling `latest` is shown as the latest release; a version tag keeps GitHub's own rule (by date)
                  make_latest: ${{ (inputs.tag || startsWith(github.ref, 'refs/tags/v')) && 'legacy' || 'true' }}
                  files: dist/*
                  generate_release_notes: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
                  fail_on_unmatched_files: true
