name: ci

on:
    push:
        branches: ["**"]
        tags:
            - "v*"
        paths-ignore:
            - "**.md"
            - "LICENSE*"
            - "docs/**"
            - ".gitignore"
            - ".gitattributes"
            - ".prettierrc*"
            - ".editorconfig"
            - ".vscode/**"
            - ".github/dependabot.yml"
            - ".github/workflows/security-review.yml"
            - ".github/workflows/weekly-security.yml"
            - "**/.DS_Store"
    pull_request:
        paths-ignore:
            - "**.md"
            - "LICENSE*"
            - "docs/**"
            - ".gitignore"
            - ".gitattributes"
            - ".prettierrc*"
            - ".editorconfig"
            - ".vscode/**"
            - ".github/dependabot.yml"
            - ".github/workflows/security-review.yml"
            - ".github/workflows/weekly-security.yml"
            - "**/.DS_Store"
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag of the release to create (made from the selected branch if it does not exist)"
                required: true

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    RUST_BACKTRACE: 1
    CARGO_TERM_COLOR: always

jobs:
    check:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  override: true
                  profile: minimal
                  components: rustfmt, clippy
                  target: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@v2
            - name: fmt
              run: cargo fmt --all --check
            - name: clippy (native crates)
              run: cargo clippy --workspace --exclude chintai-web --all-targets -- -D warnings
            - name: clippy (wasm)
              run: cargo clippy -p chintai-web --target wasm32-unknown-unknown -- -D warnings
            - name: test
              run: cargo test --workspace --exclude chintai-web
            - name: wasm build
              run: cargo build -p chintai-web --target wasm32-unknown-unknown

    # The web part (WASM) is built once; every platform's archive gets the same web/dist.
    web:
        name: Build - web
        needs: check
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  override: true
                  profile: minimal
                  target: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@v2
            - name: Install wasm-bindgen-cli (the version of Cargo.lock)
              run: |
                  v=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[^0-9.]/,"",$0); print; exit}' Cargo.lock)
                  cargo install wasm-bindgen-cli --locked --version "$v"
            - run: web/build.sh --release
            - uses: actions/upload-artifact@v4
              with:
                  name: web-dist
                  path: web/dist
                  if-no-files-found: error

    package:
        name: Build - ${{ matrix.platform.os-name }}
        needs: web
        strategy:
            fail-fast: false
            matrix:
                platform:
                    - {os-name: macOS-aarch64, runs-on: macos-latest, target: aarch64-apple-darwin, ext: "", zip: false}
                    - {os-name: Windows-x86_64, runs-on: windows-2025, target: x86_64-pc-windows-msvc, ext: ".exe", zip: true}
                    - {os-name: Linux-x86_64-musl, runs-on: ubuntu-24.04, target: x86_64-unknown-linux-musl, ext: "", zip: false}
                    - {os-name: Linux-aarch64-musl, runs-on: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, ext: "", zip: false}
        runs-on: ${{ matrix.platform.runs-on }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  override: true
                  profile: minimal
                  target: ${{ matrix.platform.target }}
            - uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.platform.target }}
            # musl-gcc compiles the C parts (SQLite) for the musl targets
            - name: Install musl tools
              if: contains(matrix.platform.target, 'linux-musl')
              run: sudo apt-get update && sudo apt-get install -y musl-tools
            - name: Build
              shell: bash
              run: |
                  if [ "${{ matrix.platform.target }}" = "x86_64-unknown-linux-musl" ]; then export CC_x86_64_unknown_linux_musl=musl-gcc; fi
                  if [ "${{ matrix.platform.target }}" = "aarch64-unknown-linux-musl" ]; then export CC_aarch64_unknown_linux_musl=musl-gcc; fi
                  cargo build --locked --release --target ${{ matrix.platform.target }} -p chintai-server -p chintai-scraper
            - uses: actions/download-artifact@v4
              with:
                  name: web-dist
                  path: web-dist
            - name: Package
              shell: bash
              run: |
                  name="chintai-selector-${{ matrix.platform.os-name }}"
                  mkdir -p "$name/web"
                  for b in chintai-server ingest; do cp "target/${{ matrix.platform.target }}/release/$b${{ matrix.platform.ext }}" "$name/"; done
                  cp -r web-dist "$name/web/dist"
                  cp README.md LICENSE Changes.md "$name/"
                  if [ "${{ matrix.platform.zip }}" = "true" ]; then
                    archive="$name.zip"
                    "$(cygpath -u "$SYSTEMROOT")/System32/tar.exe" -a -cf "$archive" "$name"
                  else
                    archive="$name.tar.gz"
                    tar czf "$archive" "$name"
                  fi
                  if command -v sha256sum > /dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
                  echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
            - uses: actions/upload-artifact@v4
              with:
                  name: chintai-selector-${{ matrix.platform.os-name }}
                  path: |
                      ${{ env.ARCHIVE }}
                      ${{ env.ARCHIVE }}.sha256
                  if-no-files-found: error

    release:
        name: Release
        needs: package
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: dist
                  pattern: chintai-selector-*
                  merge-multiple: true
            - name: Move the latest tag
              if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/latest" -f sha="${{ github.sha }}" -F force=true \
                    || gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/latest" -f sha="${{ github.sha }}"
            - name: Make the release
              if: github.event_name != 'pull_request'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'latest' }}
                  target_commitish: ${{ github.sha }}
                  prerelease: ${{ !(inputs.tag || startsWith(github.ref, 'refs/tags/v')) }}
                  files: dist/*
                  generate_release_notes: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
                  fail_on_unmatched_files: true
