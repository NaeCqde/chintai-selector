name: ci

on:
    push:
    pull_request:

env:
    RUST_BACKTRACE: 1
    CARGO_TERM_COLOR: always

jobs:
    check:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  override: true
                  profile: minimal
                  components: rustfmt, clippy
                  target: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@v2
            - name: fmt
              run: cargo fmt --all --check
            - name: clippy (native crates)
              run: cargo clippy --workspace --exclude chintai-web --all-targets -- -D warnings
            - name: clippy (wasm)
              run: cargo clippy -p chintai-web --target wasm32-unknown-unknown -- -D warnings
            - name: test
              run: cargo test --workspace --exclude chintai-web
            - name: wasm build
              run: cargo build -p chintai-web --target wasm32-unknown-unknown
