[package]
name = "chintai-types"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "chintai_types"
path = "src/lib.rs"

# Pure data types shared by the scraper, the server engine, and the WASM
# frontend. serde only — must stay compilable to wasm32.
[dependencies]
serde = { version = "1", features = ["derive"] }
